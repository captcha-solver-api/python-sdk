# Dependabot opens pull requests that update dependencies. Security updates
# for vulnerable dependencies also require "Dependabot alerts" and
# "Dependabot security updates" to be enabled in the repository settings.
version: 2
updates:
  # Runtime and dev dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
